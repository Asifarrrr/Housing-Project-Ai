<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Estate Valuation Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#08110e;--card:#0f1c17;--card2:#14261f;--soft:#192d25;--line:#25403442;--line2:#254034;--text:#eaf2ec;--mute:#8fa79a;--lime:#b8f26b;--green:#4fd18b;--sand:#ecd9a6;--bad:#fb7185}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:15px/1.5 "Albert Sans",system-ui,sans-serif;background:
 repeating-radial-gradient(circle at 92% -6%,transparent 0 30px,#ffffff08 30px 31px),
 radial-gradient(900px 500px at 0% 100%,#4fd18b14,transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:"DM Serif Display",Georgia,serif;font-weight:400;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:30px 28px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.title{display:flex;align-items:center;gap:16px}
.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--lime),var(--green));display:grid;place-items:center;box-shadow:0 10px 28px -8px #4fd18bb0}
.logo svg{width:28px;height:28px;stroke:#0b2016;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header h1{font-size:36px;line-height:1.1}
header p{margin:5px 0 0;color:var(--mute)}
.status{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line2);padding:8px 15px;border-radius:999px;font-size:13px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.status.ok .dot{background:var(--lime);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #b8f26baa}70%{box-shadow:0 0 0 8px #b8f26b00}100%{box-shadow:0 0 0 0 #b8f26b00}}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:22px;padding:26px;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:#34584a;box-shadow:0 20px 50px -30px #000}
.card h2{font-size:25px;margin-bottom:4px}
.sub{color:var(--mute);margin:0 0 18px;font-size:14px}
.grid{display:grid;gap:20px;margin-bottom:22px}
.gt{font:700 12px "Albert Sans";letter-spacing:.08em;text-transform:uppercase;color:var(--lime);margin:22px 0 12px;display:flex;align-items:center;gap:10px}
.gt::after{content:"";flex:1;height:1px;background:var(--line2)}
.gt:first-of-type{margin-top:4px}
.two{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 28px}
.sn{min-width:0}
.snhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.snhead label{font-weight:600;font-size:14px}
.snhead input{width:108px;background:var(--soft);border:1.5px solid transparent;color:var(--text);padding:7px 10px;border-radius:10px;font:600 14px "Albert Sans";text-align:right;transition:border-color .15s}
.snhead input:hover,.snhead input:focus{border-color:var(--green);outline:0}
input.sl{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--lime) var(--p),#1d3329 var(--p));outline:0;margin:6px 0 2px;cursor:pointer}
input.sl::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--sand);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--lime),0 4px 10px #0009}
input.sl::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--sand);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--lime)}
input.sl::-moz-range-track{background:transparent}
.snrange{display:flex;justify-content:space-between;color:#5f7a6d;font-size:11px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;border:1.5px solid var(--line2);background:var(--soft);color:var(--mute);padding:10px 16px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button:hover{border-color:var(--green);color:var(--text)}
.seg button.on{background:linear-gradient(135deg,var(--lime),var(--green));border-color:transparent;color:#0b2016;box-shadow:0 8px 20px -10px #4fd18bcc}
:is(button,input,select,summary):focus-visible{outline:2px solid var(--lime);outline-offset:2px}
button.primary{margin-top:26px;width:100%;background:linear-gradient(135deg,var(--lime),var(--green));color:#0b2016;border:0;border-radius:14px;padding:15px;font:700 16px "Albert Sans";cursor:pointer;transition:transform .15s,box-shadow .15s}
button.primary:hover{transform:translateY(-1px);box-shadow:0 14px 30px -12px #4fd18bcc}
button.primary:disabled{opacity:.6;cursor:wait;transform:none}
.err{color:var(--bad);font-size:14px;margin-top:12px}
.result{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 22px}
.info{border:2px dashed var(--line2);border-radius:18px;padding:34px 20px;color:var(--mute);font-size:14px;max-width:270px;margin-top:10px}
.tagwrap{filter:drop-shadow(0 18px 22px #000a);margin-top:14px;transform-origin:14px 50%;animation:swing .9s cubic-bezier(.2,1.2,.4,1) both}
@keyframes swing{0%{transform:rotate(16deg);opacity:0}100%{transform:rotate(-2deg);opacity:1}}
.tag{position:relative;background:var(--sand);color:#1a2a20;padding:22px 26px 22px 54px;clip-path:polygon(30px 0,100% 0,100% 100%,30px 100%,0 50%);text-align:left;min-width:270px}
.tag::before{content:"";position:absolute;left:30px;top:50%;width:13px;height:13px;margin-top:-6px;border-radius:50%;background:var(--card);box-shadow:inset 0 2px 4px #0006}
.tag small{display:block;font:600 12px "Albert Sans";letter-spacing:.06em;text-transform:uppercase;color:#4a5b4f}
.tag b{display:block;font:400 40px/1.15 "DM Serif Display",serif;margin-top:4px}
.tagnote{color:var(--mute);font-size:13px;margin:20px 0 0;max-width:250px}
.sechead{margin:38px 0 14px}
.sechead h2{font-size:30px}.sechead p{margin:4px 0 0;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--accent,var(--lime))}
.kpi span{color:var(--mute);font-size:13px;padding-left:6px}
.kpi b{display:block;font:400 32px "DM Serif Display",serif;margin-top:2px;padding-left:6px}
.fgroup{margin-bottom:26px}
.fgroup>label{display:block;font-weight:600;font-size:14px;margin-bottom:10px}
.rf{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rf span{color:var(--mute);font-size:13px}
.rf input{flex:1;min-width:0;background:var(--soft);border:1.5px solid transparent;color:var(--text);padding:7px 10px;border-radius:10px;font:600 13px "Albert Sans";transition:border-color .15s}
.rf input:hover,.rf input:focus{border-color:var(--green);outline:0}
.dual{position:relative;height:28px}
.track{position:absolute;top:12px;left:10px;right:10px;height:4px;background:#1d3329;border-radius:4px}
.fill{position:absolute;height:100%;background:linear-gradient(90deg,var(--lime),var(--green));border-radius:4px}
.dual input{position:absolute;left:0;top:0;width:100%;height:28px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-runnable-track{background:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:all;width:20px;height:20px;border-radius:50%;background:var(--sand);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--lime),0 4px 10px #0009;cursor:grab}
.dual input::-moz-range-thumb{pointer-events:all;width:14px;height:14px;border-radius:50%;background:var(--sand);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--lime);cursor:grab}
.hintline{color:#5f7a6d;font-size:12px;margin-top:2px}
.cbar{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;margin-bottom:12px;flex-wrap:wrap}
.cbar i{display:block;height:8px;width:160px;border-radius:99px}
.cwrap{position:relative;height:420px}
.notice{display:flex;gap:12px;align-items:center;color:#f2c14e;background:#f2c14e12;border:1px solid #f2c14e40;border-radius:14px;padding:16px 18px}
details.card summary{cursor:pointer;font:400 22px "DM Serif Display",serif}
.tbl{overflow:auto;max-height:380px;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}
tbody tr:hover{background:#ffffff06}
@media(max-width:1000px){.grid{grid-template-columns:1fr!important}.kpis{grid-template-columns:repeat(2,1fr)}.result{position:static}.wrap{padding:22px 16px 60px}}
@media(max-width:620px){.two{grid-template-columns:1fr}.tag{min-width:0;width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const API = 'http://127.0.0.1:8000';
Chart.defaults.color = '#8fa79a';
Chart.defaults.font.family = '"Albert Sans", system-ui, sans-serif';

/* ---- same options and column names as the Streamlit app ---- */
const OCEANS = [['<1H OCEAN', 'ocean_proximity_1H_OCEAN'], ['INLAND', 'ocean_proximity_INLAND'], ['ISLAND', 'ocean_proximity_ISLAND'],
                ['NEAR BAY', 'ocean_proximity_NEAR_BAY'], ['NEAR OCEAN', 'ocean_proximity_NEAR_OCEAN']];
const on = v => v === 1 || v === true || v === '1' || v === 'True';
// '<1H OCEAN' is the category with all dummy columns at 0 (or its own column when it exists)
const oceanOf = r => { const m = OCEANS.find(([, k]) => on(r[k])); return m ? m[0] : '<1H OCEAN'; };
const compact = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });
const money = v => '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const RAMP = ['#5eead4', '#a3e635', '#facc15', '#fb923c', '#f43f5e'];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const RGB = RAMP.map(hex);
function rampColor(t) {
  const x = Math.min(1, Math.max(0, t)) * (RGB.length - 1), i = Math.min(Math.floor(x), RGB.length - 2), f = x - i;
  return 'rgb(' + RGB[i].map((c, k) => Math.round(c + (RGB[i + 1][k] - c) * f)).join(',') + ')';
}

const clampNum = (v, lo, hi, whole = true) => {
  const n = v === '' || isNaN(+v) ? lo : (whole ? Math.round(+v) : +v);
  return Math.min(hi, Math.max(lo, n));
};

/* ---------- Components ---------- */
function Seg({ options, value, onChange, label }) {
  return (
    <div className="seg" role="radiogroup" aria-label={label}>
      {options.map(([v, text]) => (
        <button key={v} role="radio" aria-checked={v === value} className={v === value ? 'on' : ''} onClick={() => onChange(v)}>{text}</button>
      ))}
    </div>
  );
}

function SliderNum({ label, min, max, step, inputStep, whole = true, value, onChange }) {
  const num = clampNum(value, min, max, whole);
  const p = (num - min) / (max - min) * 100;
  return (
    <div className="sn">
      <div className="snhead">
        <label>{label}</label>
        <input type="number" min={min} max={max} step={inputStep || step} value={value} aria-label={label}
          onChange={e => onChange(e.target.value)}
          onBlur={() => onChange(String(clampNum(value, min, max, whole)))} />
      </div>
      <input className="sl" type="range" min={min} max={max} step={step} value={num} style={{ '--p': p + '%' }}
        aria-label={label + ' slider'} onChange={e => onChange(e.target.value)} />
      <div className="snrange"><span>{min.toLocaleString()}</span><span>{max.toLocaleString()}</span></div>
    </div>
  );
}

function DualSlider({ lo, hi, value: [a, b], onChange, label }) {
  const pct = v => hi === lo ? 0 : (v - lo) / (hi - lo) * 100;
  return (
    <div className="dual">
      <div className="track"><div className="fill" style={{ left: pct(a) + '%', width: (pct(b) - pct(a)) + '%' }} /></div>
      <input type="range" min={lo} max={hi} value={a} aria-label={'Minimum ' + label}
        style={{ zIndex: a > hi - (hi - lo) * 0.1 ? 3 : 1 }} onChange={e => onChange([Math.min(+e.target.value, b), b])} />
      <input type="range" min={lo} max={hi} value={b} aria-label={'Maximum ' + label}
        style={{ zIndex: 2 }} onChange={e => onChange([a, Math.max(+e.target.value, a)])} />
    </div>
  );
}

// typed value is applied when the box loses focus (so typing is never fought by clamping)
function NumBox({ value, onCommit, label }) {
  const [t, setT] = useState(String(value));
  useEffect(() => setT(String(value)), [value]);
  return <input type="number" value={t} aria-label={label} onChange={e => setT(e.target.value)}
    onBlur={() => onCommit(t)} onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }} />;
}

// slider + exact min/max boxes + the real data range, so a few extreme values never make it unusable
function RangeFilter({ lo, hi, value: [a, b], onChange, label }) {
  const commit = (i, v) => {
    const n = Number(v);
    if (v === '' || isNaN(n)) { onChange([a, b]); return; }
    const c = Math.min(hi, Math.max(lo, n));
    onChange(i === 0 ? [Math.min(c, b), b] : [a, Math.max(c, a)]);
  };
  return (
    <div>
      <div className="rf">
        <NumBox value={a} label={'Minimum ' + label} onCommit={v => commit(0, v)} />
        <span>to</span>
        <NumBox value={b} label={'Maximum ' + label} onCommit={v => commit(1, v)} />
      </div>
      <DualSlider lo={lo} hi={hi} value={[a, b]} onChange={onChange} label={label} />
      <div className="hintline">Data range: {lo.toLocaleString()} to {hi.toLocaleString()}</div>
    </div>
  );
}

function useCountUp(target) {
  const [v, setV] = useState(0);
  const prev = useRef(0);
  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setV(target); prev.current = target; return; }
    const from = prev.current, t0 = performance.now(), dur = 800;
    let id;
    const tick = now => {
      const p = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
      setV(from + (target - from) * e);
      if (p < 1) id = requestAnimationFrame(tick); else prev.current = target;
    };
    id = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(id);
  }, [target]);
  return v;
}

function Kpi({ label, value, format, accent, empty }) {
  const shown = useCountUp(value);
  return (
    <div className="card kpi" style={{ '--accent': accent }}>
      <span>{label}</span>
      <b>{empty ? '–' : format(shown)}</b>
    </div>
  );
}

function ChartBox({ type, data, options }) {
  const ref = useRef(), chart = useRef();
  useEffect(() => {
    chart.current = new Chart(ref.current, { type, data, options });
    return () => chart.current.destroy();
  }, []);
  useEffect(() => {
    if (!chart.current) return;
    chart.current.data = data;
    chart.current.update();
  }, [data]);
  return <div className="cwrap"><canvas ref={ref} /></div>;
}

/* ---------- Prediction ---------- */
function Predictor({ onOffline }) {
  const [f, setF] = useState({ long: -122, lat: 37, age: 30, rooms: 2000, beds: 400, pop: 1200, holds: 400, income: 3.5, ocean: '<1H OCEAN' });
  const [res, setRes] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const set = k => v => setF(s => ({ ...s, [k]: v }));
  const one = (a, b) => a === b ? 1 : 0;
  const price = useCountUp(res ? res.value : 0);

  async function predict() {
    const v = {
      long: clampNum(f.long, -250, -50, false), lat: clampNum(f.lat, 20, 80, false), age: clampNum(f.age, 1, 100),
      rooms: clampNum(f.rooms, 7, 60000), beds: clampNum(f.beds, 1, 15000), pop: clampNum(f.pop, 3, 50000),
      holds: clampNum(f.holds, 2, 15000), income: clampNum(f.income, 0.5, 20, false)
    };
    setF(s => ({ ...s, ...v }));
    const payload = {
      longitude: v.long, latitude: v.lat, housing_median_age: v.age, total_rooms: v.rooms, total_bedrooms: v.beds,
      population: v.pop, households: v.holds, median_income: v.income,
      ocean_proximity_1H_OCEAN: one(f.ocean, '<1H OCEAN'),
      ocean_proximity_INLAND: one(f.ocean, 'INLAND'),
      ocean_proximity_ISLAND: one(f.ocean, 'ISLAND'),
      ocean_proximity_NEAR_BAY: one(f.ocean, 'NEAR BAY'),
      ocean_proximity_NEAR_OCEAN: one(f.ocean, 'NEAR OCEAN')
    };
    setLoading(true); setErr('');
    try {
      const r = await fetch(API + '/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      setRes({ value: Math.round(j.Prediction * 100) / 100, id: Date.now() });
    } catch (e) {
      setErr('Could not connect to API server!');
      onOffline();
    }
    setLoading(false);
  }

  return (
    <div className="grid" style={{ gridTemplateColumns: '1.6fr .9fr' }}>
      <div className="card">
        <h2>Fill the features below</h2>
        <p className="sub">Drag a slider or type an exact value.</p>
        <div className="gt">Location</div>
        <div className="two">
          <SliderNum label="Longitude" min={-250} max={-50} step={1} inputStep={0.01} whole={false} value={f.long} onChange={set('long')} />
          <SliderNum label="Latitude" min={20} max={80} step={1} inputStep={0.01} whole={false} value={f.lat} onChange={set('lat')} />
        </div>
        <div className="gt">House</div>
        <div className="two">
          <SliderNum label="Median Age" min={1} max={100} step={1} value={f.age} onChange={set('age')} />
          <SliderNum label="Total Rooms" min={7} max={60000} step={20} value={f.rooms} onChange={set('rooms')} />
          <SliderNum label="Total Bedrooms" min={1} max={15000} step={100} value={f.beds} onChange={set('beds')} />
        </div>
        <div className="gt">Neighborhood</div>
        <div className="two">
          <SliderNum label="Population" min={3} max={50000} step={100} value={f.pop} onChange={set('pop')} />
          <SliderNum label="Households" min={2} max={15000} step={100} value={f.holds} onChange={set('holds')} />
          <SliderNum label="Median Income" min={0.5} max={20} step={0.1} inputStep={0.01} whole={false} value={f.income} onChange={set('income')} />
        </div>
        <div className="gt">Ocean Proximity</div>
        <Seg label="Ocean Proximity" value={f.ocean} onChange={set('ocean')} options={OCEANS.map(([n]) => [n, n])} />
        <button className="primary" onClick={predict} disabled={loading}>{loading ? 'Predicting…' : 'Predict Price'}</button>
        {err && <div className="err" role="alert">{err}</div>}
      </div>

      <div className="card result">
        <h2 style={{ fontSize: 24 }}>Live Price Prediction</h2>
        {!res && <div className="info">Fill the features on the left before clicking on (Predict Price)</div>}
        {res && <>
          <div key={res.id} className="tagwrap">
            <div className="tag"><small>Estimated Median House Value</small><b>{money(price)}</b></div>
          </div>
          <p className="tagnote">Estimate from the Random Forest Regressor for the features you entered.</p>
        </>}
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [rows, setRows] = useState([]);
  const [online, setOnline] = useState(null);
  const [rooms, setRooms] = useState([0, 1]);
  const [holds, setHolds] = useState([0, 1]);
  const [ocean, setOcean] = useState('');
  const loaded = useRef(false);

  const range = (data, k) => {
    let lo = Infinity, hi = -Infinity;
    for (const r of data) { const v = +r[k]; if (v < lo) lo = v; if (v > hi) hi = v; }
    return data.length ? [Math.floor(lo), Math.ceil(hi)] : [0, 1];
  };

  function loadData() {
    fetch(API + '/data').then(r => r.json()).then(list => {
      const data = list.map(r => ({ ...r, ocean_proximity: oceanOf(r) }));
      loaded.current = true;
      setRows(data); setOnline(true);
      setRooms(range(data, 'total_rooms')); setHolds(range(data, 'households'));
      setOcean([...new Set(data.map(r => r.ocean_proximity))].sort()[0] || '');
    }).catch(() => setOnline(false));
  }

  useEffect(() => {
    loadData();
    const id = setInterval(() => { if (!loaded.current) loadData(); }, 5000);
    return () => clearInterval(id);
  }, []);

  const roomsB = useMemo(() => range(rows, 'total_rooms'), [rows]);
  const holdsB = useMemo(() => range(rows, 'households'), [rows]);
  const oceanList = useMemo(() => [...new Set(rows.map(r => r.ocean_proximity))].sort(), [rows]);
  const hasValue = rows.length > 0 && rows[0].median_house_value !== undefined;

  const d = useMemo(() => rows.filter(r =>
    r.total_rooms >= rooms[0] && r.total_rooms <= rooms[1] &&
    r.households >= holds[0] && r.households <= holds[1] &&
    r.ocean_proximity === ocean), [rows, rooms, holds, ocean]);
  const n = d.length;
  const mean = k => n ? d.reduce((s, r) => s + (+r[k] || 0), 0) / n : 0;

  const MAX_POINTS = 5000;
  const scatter = useMemo(() => {
    const step = Math.ceil(d.length / MAX_POINTS);
    const pts = step > 1 ? d.filter((_, i) => i % step === 0) : d;
    let lo = Infinity, hi = -Infinity;
    for (const r of d) { if (r.population < lo) lo = r.population; if (r.population > hi) hi = r.population; }
    const col = r => rampColor(hi > lo ? Math.sqrt((r.population - lo) / (hi - lo)) : 0.5);
    return {
      lo, hi, drawn: pts.length,
      data: { datasets: [{ label: 'Houses', data: pts.map(r => ({ x: r.total_rooms, y: r.median_income, pop: r.population, lon: r.longitude, lat: r.latitude, bed: r.total_bedrooms, hh: r.households })),
        backgroundColor: pts.map(col), pointRadius: 3.5, pointHoverRadius: 7 }] }
    };
  }, [d]);

  const grid = { color: '#25403466' };
  const scatterOpts = { maintainAspectRatio: false, animation: false,
    scales: { x: { title: { display: true, text: 'total_rooms' }, grid }, y: { title: { display: true, text: 'median_income' }, grid } },
    plugins: { legend: { display: false },
      tooltip: { callbacks: { label: c => { const p = c.raw; return [`Rooms ${p.x} · income ${p.y}`, `Population ${p.pop} · households ${p.hh}`, `Bedrooms ${p.bed}`, `Lon ${p.lon}, lat ${p.lat}`]; } } } } };

  const cols = hasValue ? ['Ocean proximity', 'Longitude', 'Latitude', 'Median age', 'Total rooms', 'Total bedrooms', 'Population', 'Households', 'Median income', 'House value']
                        : ['Ocean proximity', 'Longitude', 'Latitude', 'Median age', 'Total rooms', 'Total bedrooms', 'Population', 'Households', 'Median income'];

  return (
    <div className="wrap">
      <header>
        <div className="title">
          <div className="logo"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7" /><path d="M5 10v10h14V10" /><path d="M10 20v-6h4v6" /></svg></div>
          <div>
            <h1>Real Estate Valuation Engine</h1>
            <p>Powered by a pre-trained Random Forest Regressor Model</p>
          </div>
        </div>
        <div className={'status' + (online ? ' ok' : '')}>
          <span className="dot" />
          {online === null ? 'Connecting to API…' : online ? 'API connected' : 'API offline. Start FastAPI on port 8000'}
        </div>
      </header>

      <Predictor onOffline={() => { loaded.current = false; setOnline(false); }} />

      <div className="sechead">
        <h2>Dashboard Features</h2>
        <p>{rows.length > 0 ? `${rows.length.toLocaleString()} houses loaded. Use the filters to explore them.` : 'Waiting for the data.'}</p>
      </div>

      <section className="kpis">
        <Kpi label="Houses in selection" value={n} format={v => Math.round(v).toLocaleString()} accent="#b8f26b" empty={!rows.length} />
        <Kpi label="Average median income" value={mean('median_income')} format={v => v.toFixed(2)} accent="#4fd18b" empty={!n} />
        <Kpi label="Average total rooms" value={mean('total_rooms')} format={v => compact.format(v)} accent="#ecd9a6" empty={!n} />
        {hasValue
          ? <Kpi label="Average house value" value={mean('median_house_value')} format={v => '$' + compact.format(v)} accent="#fb923c" empty={!n} />
          : <Kpi label="Average population" value={mean('population')} format={v => compact.format(v)} accent="#fb923c" empty={!n} />}
      </section>

      <div className="grid" style={{ gridTemplateColumns: '310px 1fr' }}>
        <div className="card" style={{ alignSelf: 'start' }}>
          <h2 style={{ fontSize: 22, marginBottom: 18 }}>Filters</h2>
          <div className="fgroup"><label>Total Rooms</label>
            <RangeFilter lo={roomsB[0]} hi={roomsB[1]} value={rooms} onChange={setRooms} label="total rooms" /></div>
          <div className="fgroup"><label>Households</label>
            <RangeFilter lo={holdsB[0]} hi={holdsB[1]} value={holds} onChange={setHolds} label="households" /></div>
          <div className="fgroup" style={{ marginBottom: 0 }}><label>Ocean Proximity</label>
            <Seg label="Ocean proximity filter" value={ocean} onChange={setOcean} options={oceanList.map(o => [o, o])} /></div>
        </div>

        <div className="card">
          <h2>Total Rooms vs Median Income</h2>
          <p className="sub">Colored by population{n > MAX_POINTS ? `. To stay fast, ${MAX_POINTS.toLocaleString()} evenly spaced houses are drawn.` : '.'}</p>
          {n > 0 ? <>
            <div className="cbar">
              <span>Population</span><span>{compact.format(scatter.lo)}</span>
              <i style={{ background: 'linear-gradient(90deg,' + RAMP.join(',') + ')' }} />
              <span>{compact.format(scatter.hi)}</span>
            </div>
            <ChartBox type="scatter" data={scatter.data} options={scatterOpts} />
          </> : <div className="notice" role="status">No house has matched those features, try again!</div>}
        </div>
      </div>

      {rows.length > 0 && (
        <details className="card">
          <summary>Data Preview (First 100 Rows)</summary>
          <div className="tbl"><table>
            <thead><tr>{cols.map(c => <th key={c}>{c}</th>)}</tr></thead>
            <tbody>{rows.slice(0, 100).map((r, i) => (
              <tr key={i}>
                <td>{r.ocean_proximity}</td><td>{r.longitude}</td><td>{r.latitude}</td><td>{r.housing_median_age}</td>
                <td>{r.total_rooms}</td><td>{r.total_bedrooms}</td><td>{r.population}</td><td>{r.households}</td><td>{r.median_income}</td>
                {hasValue && <td>{r.median_house_value}</td>}
              </tr>))}
            </tbody>
          </table></div>
        </details>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
